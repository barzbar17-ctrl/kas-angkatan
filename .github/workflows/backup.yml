name: Backup
on:
  schedule:
    - cron: '17 19 * * *' # 02.17 WIB setiap hari
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump terenkripsi
        env:
          # Pooler MODE SESI (bukan transaksi); bila runner hanya IPv4, jangan pakai koneksi langsung Supabase (V-4).
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup.sh "kas-$(date -u +%Y%m%d).dump.enc"
      - uses: actions/upload-artifact@v7
        with:
          name: backup-db
          path: kas-*.dump.enc
          retention-days: 30
          if-no-files-found: error
      # Satu salinan per bulan dikomit ke repositori privat khusus backup (PRD 17.4). Aktif bila BACKUP_REPO terisi.
      - name: Salinan bulanan
        if: github.event_name == 'schedule'
        env:
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ "$(date -u +%d)" != "01" ] || [ -z "${BACKUP_REPO:-}" ]; then echo "Bukan awal bulan atau BACKUP_REPO kosong; dilewati."; exit 0; fi
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" monthly
          cp kas-*.dump.enc monthly/
          cd monthly && git config user.name backup && git config user.email backup@example.invalid
          git add . && git commit -m "Backup bulanan $(date -u +%Y-%m)" && git push
