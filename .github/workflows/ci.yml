name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DB_OWNER_URL: postgres://postgres:postgres@localhost:5432/kas_test
      TEST_DB_APP_URL: postgres://app_backend:app_backend_test@localhost:5432/kas_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:db:setup
      - run: npm test
      - run: npm run build
      - run: npm run size
      # SX-05: gagal hanya untuk tingkat high ke atas; temuan moderate pada alat build dicatat di DECISIONS.
      - run: npm audit --audit-level=high
